# Drop-in for panchang.service: chat answers in the member's language with
# the free local model from astrisk-translate.service. Install as
# ~/.config/systemd/user/panchang.service.d/translate.conf
[Unit]
Wants=astrisk-translate.service
After=astrisk-translate.service

[Service]
Environment=TRANSLATE_URL=http://127.0.0.1:18093

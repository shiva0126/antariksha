# Drop-in for panchang.service: semantic search over the reading library with
# the free local model from astrisk-embedding.service. Install as
# ~/.config/systemd/user/panchang.service.d/embedding.conf
[Unit]
Wants=astrisk-embedding.service
After=astrisk-embedding.service

[Service]
Environment=RAG_SEMANTIC_ENABLED=true
Environment=EMBEDDING_PROVIDER=local

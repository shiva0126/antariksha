services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: panchang
      POSTGRES_USER: panchang
      POSTGRES_PASSWORD: panchang
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panchang"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    image: migrate/migrate:v4.17.1
    volumes: ["./db/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgres://panchang:panchang@db:5432/panchang?sslmode=disable", "up"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    environment:
      DATABASE_URL: postgres://panchang:panchang@db:5432/panchang?sslmode=disable
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["8080:8080"]
  web:
    build: ./web
    depends_on: [api]
    ports: ["3000:80"]
volumes: {pgdata: {}}
